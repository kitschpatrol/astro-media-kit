packages:
  - .
  - playground
  - playground-starlight
  - test/parity/fixtures/core-image
  - test/parity/fixtures/picture-darkmode
allowBuilds:
  esbuild: true
  puppeteer: true
  unrs-resolver: true
ignoreWorkspaceRootCheck: true
minimumReleaseAgeExclude:
  - '@mux/mux-node@15.5.0'
  - node-gyp@13.1.0
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - 'case-police'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
