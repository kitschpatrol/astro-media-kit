allowBuilds:
  esbuild: true
  puppeteer: true
ignoreWorkspaceRootCheck: true
minimumReleaseAgeExclude:
  - '@kitschpatrol/chagent@0.8.0'
overrides:
  # These callers use the retained glob/minimatch APIs. Remove when upstream
  # adopts fixes for GHSA-3g3m-2fjr-6pw4 and GHSA-g3hv-75wg-m249.
  '@npmcli/map-workspaces@3>glob': ^14.0.6
  '@npmcli/map-workspaces@3>minimatch': ^11.0.8
  '@npmcli/package-json@5>glob': ^14.0.6
  '@typescript-eslint/typescript-estree@8>minimatch': ^11.0.8
  'unified-engine@11>glob': ^14.0.6
packages:
  - .
  - playground
  - playground-starlight
  - test/parity/fixtures/core-image
  - test/parity/fixtures/picture-darkmode
  - test/parity/fixtures/theme
peerDependencyRules:
  allowedVersions:
    # Remove once the installed version declares ESLint 10 support.
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/issues/1075
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/pull/1081
    eslint-plugin-jsx-a11y@6>eslint: ^10.0.0
permissions:
  '@kitschpatrol/shared-config':
    skills: true
  '@videojs/skills@https://codeload.github.com/videojs/skills/tar.gz/66afaeb4508f324b0b554700d52cb6a5a7a5b14c':
    skills: true
  modern-web-guidance:
    skills: [modern-web-guidance]
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
  - 'case-police'
skills:
  dirs:
    - .agents/skills
    - .claude/skills
