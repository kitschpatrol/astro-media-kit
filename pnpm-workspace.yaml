allowBuilds:
  esbuild: true
  puppeteer: true
ignoreWorkspaceRootCheck: true
minimumReleaseAgeExclude:
  - '@kitschpatrol/chagent@0.5.0'
  - astro-mdx-kit@0.8.0
packageExtensions:
  # astro2tsx pins @emnapi/core but leaves @emnapi/runtime to peer resolution,
  # which picks rolldown's 2.0 beta and crashes the 1.x core on load.
  # Keep in step with its @emnapi/core pin; remove once it declares the runtime.
  '@astrojs/astro2tsx':
    dependencies:
      '@emnapi/runtime': 1.11.3
packages:
  - .
  - playground
  - playground-starlight
  - test/parity/fixtures/core-image
  - test/parity/fixtures/picture-darkmode
peerDependencyRules:
  allowedVersions:
    # Remove once the installed version declares ESLint 10 support.
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/issues/1075
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/pull/1081
    eslint-plugin-jsx-a11y@6>eslint: ^10.0.0
permissions:
  '@kitschpatrol/shared-config':
    skills: true
  '@videojs/skills@https://codeload.github.com/videojs/skills/tar.gz/66afaeb4508f324b0b554700d52cb6a5a7a5b14c':
    skills: true
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
  - 'case-police'
skills:
  dirs:
    - .agents/skills
    - .claude/skills
